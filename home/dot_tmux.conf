set -g status off
set -g pane-border-style fg=black
set -g pane-active-border-style fg=brightblack
set -g detach-on-destroy off

# Use Ctrl+A as prefix (easier to reach than Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf

# Intuitive splits (same directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Move between panes with Alt+arrows (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize panes with prefix + hjkl
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5
bind -r k resize-pane -U 5
bind -r j resize-pane -D 5

# Move between windows with Shift+arrows (no prefix needed)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1

# Mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 10000

# True color support for Helix
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Faster key response (reduces Helix ESC delay)
set -sg escape-time 0
